[project]
name = "youtarr-mcp"
version = "0.0.0"
description = "MCP server for the Youtarr v1.95.0 session API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.2.0,<5", "httpx>=0.27.0"]

[project.scripts]
youtarr-mcp = "youtarr_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.9.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: hits a real Youtarr instance with read-only requests"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
